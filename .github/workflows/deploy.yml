name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Test gate: a failure here fails this job, and the deploy job below
      # (needs: build) never runs — so this blocks production deploys.
      #
      # `npm run build` is the fastest deterministic check available and is what
      # we gate on. The two scripts under scripts/ were deliberately NOT wired in
      # here:
      #   - test:sms drives the sms-timesheet edge function through real Claude
      #     API calls (~10 min, real per-run cost). Since 2026-10-06 it refuses
      #     to run against production (no tests in production) until the bot is
      #     deployed to the dev project.
      #   - test:cores-schema runs against the dev database only (reads
      #     .env.development.local), which this job doesn't have. Refresh dev
      #     from production with refresh-dev-db.yml, then run it locally.
      - name: Test gate (build must succeed)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
