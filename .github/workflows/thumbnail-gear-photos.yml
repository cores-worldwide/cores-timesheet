name: Thumbnail gear photos

# Photos texted in via MMS are stored by the sms-timesheet edge function
# without a grid thumbnail (see scripts/backfill-thumbs.mjs). This fills them
# in nightly so the Gear Photos grid isn't pulling full-size originals for
# yesterday's texts. Read-only on originals.
on:
  schedule:
    - cron: '30 8 * * *'   # shortly after the schema backup, ~5am Atlantic
  workflow_dispatch: {}

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - name: Check VITE_SUPABASE_ANON_KEY is set
        env:
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY secret is not set — it's the same secret the Pages deploy uses; add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate missing thumbnails
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/backfill-thumbs.mjs
