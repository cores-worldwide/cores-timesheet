name: Thumbnail gear photos

# Photos texted in via MMS are stored by the sms-timesheet edge function
# without a grid thumbnail (see scripts/backfill-thumbs.mjs). This fills them
# in nightly so the Gear Photos grid isn't pulling full-size originals for
# yesterday's texts. Read-only on originals.
on:
  schedule:
    - cron: '30 8 * * *'   # shortly after the schema backup, ~5am Atlantic
  workflow_dispatch: {}

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - name: Check SUPABASE_ANON_KEY is set
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set — add it under Settings > Secrets and variables > Actions (same value as VITE_SUPABASE_ANON_KEY in .env.local)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate missing thumbnails
        env:
          SUPABASE_URL: https://wgjuflwbkmgirhqoqfgp.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/backfill-thumbs.mjs
