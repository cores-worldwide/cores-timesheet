name: Backup to Google Drive

# Second custodian for everything in the Supabase project, outside Supabase
# and outside GitHub's 90-day artifact window:
#   Cores Backups/db/daily/    nightly pg_dump of Cores + BLD_Inventory, last 30 kept
#   Cores Backups/db/monthly/  the 1st-of-month dump, kept forever
#   Cores Backups/gear-photos/ every original in the gear-photos bucket (they
#                              may be evidence years later), laid out by job
#                              for humans with a photo-index.csv — copy/move
#                              only, never deleted here even if deleted in
#                              the app (see scripts/backup-gear-photos.mjs)
#
# Google Drive access is an rclone OAuth token with the drive.file scope, so it
# can only see files it created itself. Made once with `rclone authorize
# "drive"` on Jim's machine and stored as the RCLONE_DRIVE_TOKEN secret.
on:
  schedule:
    - cron: '0 9 * * *'   # ~5-6am Atlantic, after the schema backup
  workflow_dispatch: {}

env:
  DRIVE_ROOT: 'drive:Cores Backups'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        env:
          DRIVE_TOKEN_SECRET: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          for v in DRIVE_TOKEN_SECRET SUPABASE_DB_URL VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v secret is not set — add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # NB: the env var is deliberately NOT named RCLONE_DRIVE_TOKEN — rclone
      # reads RCLONE_<BACKEND>_<OPTION> from the environment as a config
      # override, so that name would feed the raw secret straight to the drive
      # backend as its token and bypass the decoding below.
      - name: Configure rclone
        env:
          DRIVE_TOKEN_SECRET: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          # Recent rclone versions print `rclone authorize` output as a base64
          # config blob ({"token":"<json>"}) rather than the bare token JSON;
          # accept either form so the secret can be pasted straight from it.
          python3 - <<'PY'
          import base64, json, os
          raw = os.environ['DRIVE_TOKEN_SECRET'].strip()
          try:
              json.loads(raw); token = raw
          except ValueError:
              decoded = json.loads(base64.b64decode(raw + '=' * (-len(raw) % 4)))
              token = decoded.get('token', decoded) if isinstance(decoded, dict) else decoded
              if not isinstance(token, str): token = json.dumps(token)
          json.loads(token)  # must be valid token JSON or fail loudly here, not deep in rclone
          path = os.path.expanduser('~/.config/rclone/rclone.conf')
          with open(path, 'w') as f:
              f.write(f"[drive]\ntype = drive\nscope = drive.file\ntoken = {token}\n")
          os.chmod(path, 0o600)
          PY
          rclone lsd drive: >/dev/null && echo "Drive access OK"

      # ── Database ────────────────────────────────────────────────────────
      - name: Dump database (Cores + BLD_Inventory)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # See backup-cores-schema.yml for why pg_dump is called directly.
          # --no-privileges deliberately NOT used: the GRANTs are essential to a
          # working restore (anon/authenticated have direct table access).
          mkdir -p out/db
          docker run --rm ghcr.io/supabase/postgres:17.6.1.143 \
            pg_dump "$SUPABASE_DB_URL" --schema='"Cores"' --schema='"BLD_Inventory"' --no-owner \
            | gzip > "out/db/supabase_$(date -u +%Y%m%d).sql.gz"
          ls -la out/db

      - name: Upload dump — daily (keep 30) and monthly (keep forever)
        run: |
          rclone copy out/db "$DRIVE_ROOT/db/daily" --no-traverse
          rclone delete "$DRIVE_ROOT/db/daily" --min-age 31d
          if [ "$(date -u +%d)" = "01" ]; then
            rclone copy out/db "$DRIVE_ROOT/db/monthly" --no-traverse
          fi

      # ── Photos ──────────────────────────────────────────────────────────
      - name: Copy new gear-photos files (laid out by job)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # What's in Drive now, and last night's index (both empty on the first run).
          rclone lsf -R --files-only "$DRIVE_ROOT/gear-photos" > drive-listing.txt 2>/dev/null || true
          rclone cat "$DRIVE_ROOT/gear-photos/photo-index.csv" > prev-index.csv 2>/dev/null || true
          node scripts/backup-gear-photos.mjs drive-listing.txt prev-index.csv out/gear-photos moves.tsv
          # Server-side moves for photos already in Drive under an old path
          # (the original date layout, or a job they were since re-tagged away
          # from). Nothing is ever deleted from Drive.
          while IFS=$'\t' read -r from to; do
            [ -n "$from" ] && rclone moveto "$DRIVE_ROOT/gear-photos/$from" "$DRIVE_ROOT/gear-photos/$to"
          done < moves.tsv
          # copy, never sync — sync would mirror deletions into the backup.
          rclone copy out/gear-photos "$DRIVE_ROOT/gear-photos" --no-traverse

      - name: Record outcome (measured from Drive)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          daily=$(rclone size --json "$DRIVE_ROOT/db/daily")
          monthly=$(rclone size --json "$DRIVE_ROOT/db/monthly" 2>/dev/null || echo '{"count":0,"bytes":0}')
          photos=$(rclone size --json "$DRIVE_ROOT/gear-photos")
          today=$(rclone lsf "$DRIVE_ROOT/db/daily" | grep -c "supabase_$(date -u +%Y%m%d).sql.gz" || true)
          details=$(jq -cn --argjson d "$daily" --argjson m "$monthly" --argjson p "$photos" --argjson t "$today" \
            '{db_daily_count: $d.count, db_daily_bytes: $d.bytes, db_monthly_count: $m.count,
              gear_photos_count: $p.count, gear_photos_bytes: $p.bytes, todays_dump_present: ($t > 0)}')
          echo "$details" | jq .
          scripts/log-backup.sh drive-backup true "$details"
          { echo "## Google Drive backup"; echo '```'; echo "$details" | jq .; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Record failure
        if: failure()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: scripts/log-backup.sh drive-backup false '{"note":"a step failed — see run_url"}'
