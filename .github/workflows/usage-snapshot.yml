name: Usage snapshot

# Nightly traffic & credit numbers (Supabase, Twilio, Claude API) for Jim's
# private dashboard. See scripts/usage-snapshot.mjs. Writes only to
# "Cores".usage_daily; never touches app data.
on:
  schedule:
    - cron: '30 7 * * *'   # 3:30-4:30am Atlantic, after the local day has closed
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ask each service for yesterday's numbers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
        run: node scripts/usage-snapshot.mjs usage-rows.json
      # Runs even if one service failed, so the others' numbers still land.
      - name: Save to usage_daily
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/usage-upsert.sh "$SUPABASE_DB_URL" usage-rows.json
      - name: Record outcome
        if: success()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: scripts/log-backup.sh usage-snapshot true "{\"rows\": $(jq length usage-rows.json)}"
      - name: Record failure
        if: failure()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: scripts/log-backup.sh usage-snapshot false '{"note":"a service failed — see run_url"}'
